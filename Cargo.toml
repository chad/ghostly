[package]
name = "ghostly"
version = "0.1.0"
edition = "2021"
description = "Particle-face character rendering — a Rust port of the avatar visuals (~/src/avatar)"
license = "MIT OR Apache-2.0"

[dependencies]
# Software raster — same library Eliza's tile uses, so a ghostly frame
# can drop straight into the existing h264/MoQ broadcast path.
tiny-skia = "0.11"
# PNG output for the standalone demo (`ghostly render --output out.png`).
png = "0.17"
# Deterministic, fast per-particle randomness — keeps a Character
# reproducible from a seed. `rand` would be overkill.
fastrand = "2"
# Real-time DSP. Used selectively for the voice-effects chain — fundsp
# provides the biquad filter primitives we need for EQ / formant
# bandpasses / comb damping. The rest of the chain (granular pitch
# shifter, glitch buffer, Hilbert freq shifter, shimmer reverb, chorus)
# is hand-rolled because it ports directly from the avatar's
# AudioWorklets and a graph-style abstraction would add friction.
fundsp = "0.20"
# WAV I/O for the offline-test CLI (`ghostly voice <character>
# --input in.wav --output out.wav`). The live-stream API takes raw
# f32 slices and never touches `hound`.
hound = "3"
# Character packs — serializable, forkable character definitions
# (geometry + palette + render effects + voice DSP). JSON, not TOML:
# `RenderConfig` interleaves scalars and sub-tables, which TOML's
# "values before tables" rule rejects; JSON has no such constraint.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "ghostly"
path = "src/main.rs"

[lib]
name = "ghostly"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
